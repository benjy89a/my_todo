<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>할 일</h1>
      <div id="user-box" hidden>
        <span id="user-email"></span>
        <button id="logout" type="button">로그아웃</button>
      </div>
    </header>

    <p id="error" hidden></p>
    <p id="notice" hidden></p>

    <section id="auth-view" hidden>
      <form id="auth-form">
        <input id="email" type="email" placeholder="이메일" required autocomplete="email">
        <input id="password" type="password" placeholder="비밀번호 (6자 이상)" required minlength="6" autocomplete="current-password">
        <div class="row">
          <button type="submit" data-mode="login" class="primary">로그인</button>
          <button type="submit" data-mode="signup">회원가입</button>
        </div>
      </form>
    </section>

    <section id="app-view" hidden>
      <form id="add-form">
        <input id="title" placeholder="할 일을 입력하세요" required autocomplete="off">
        <div class="row">
          <label>마감일 <input id="due" type="date"></label>
          <input id="tags" placeholder="태그 (쉼표로 구분: 업무, 공부)" autocomplete="off">
          <button type="submit" class="primary">추가</button>
        </div>
      </form>

      <nav id="status-filter">
        <button data-status="all" class="active">전체</button>
        <button data-status="active">진행 중</button>
        <button data-status="done">완료</button>
        <button data-status="overdue">마감 지남</button>
      </nav>
      <div id="tag-filter"></div>

      <ul id="list"></ul>
      <p id="empty" hidden>할 일이 없어요.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
